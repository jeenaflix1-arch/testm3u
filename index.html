<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JeenaFlix Web Player</title>
    <!-- HLS.js Script -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body style="background-color: black; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0;">

    <video id="video" controls autoplay style="width: 100%; max-width: 800px; border: 2px solid #333; border-radius: 10px;"></video>

    <script>
        var video = document.getElementById('video');
        var videoSrc = 'https://omax.vip/live/strong8492/84920056/356534.m3u8';

        // چیک کریں کہ براؤزر HLS سپورٹ کرتا ہے
        if (Hls.isSupported()) {
            // یہاں ہم نے فری پراکسی لگا دی ہے جو ہر فائل کو بائی پاس کرے گی
            var hls = new Hls({
                xhrSetup: function(xhr, url) {
                    xhr.open('GET', 'https://corsproxy.io/?' + encodeURIComponent(url), true);
                }
            });
            
            hls.loadSource(videoSrc);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                video.play();
            });
        }
        // موبائل براؤزرز (جیسے سفاری) کے لیے
        else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = 'https://corsproxy.io/?' + encodeURIComponent(videoSrc);
            video.addEventListener('loadedmetadata', function() {
                video.play();
            });
        }
    </script>

</body>
</html>
